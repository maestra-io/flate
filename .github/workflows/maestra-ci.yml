name: Maestra CI

# go test + build on PRs into our default branch. Upstream's CI only targets
# main, which in this fork is the untouched upstream mirror (see MAESTRA.md).

on:
  pull_request:
    branches: [maestra/main]
  push:
    branches: [maestra/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test + build
    runs-on: runs-on=${{ github.run_id }}/pool=build
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # pkg/orchestrator's DAG tests render under a 10s deadline. On this
      # 8-vCPU t3a they take ~6s alone and time out when every package
      # runs in parallel under -race, so they get the runner to themselves.
      - name: Test pkg/orchestrator
        run: go test -race ./pkg/orchestrator/

      - name: Test the rest
        run: go test -race $(go list ./... | grep -v '/pkg/orchestrator$')

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=maestra-${GITHUB_SHA::8}" -o flate ./cmd/flate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flate-linux-${{ runner.arch }}
          path: flate
          retention-days: 14
